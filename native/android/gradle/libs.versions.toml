[versions]
# AGP is still the M0 spike's, React Native's own; it moves to 9 in #361, which takes built-in Kotlin.
agp = "8.12.0"
# No newer than stable Compose Multiplatform supports, so M8 doesn't start with a downgrade (#345).
kotlin = "2.4.21"
# AGP 8.12 bundles R8 8.12, which can't read Kotlin 2.4's metadata; 2.4 needs R8 9.1.29 or newer
# (developer.android.com/build/kotlin-support). Put on the root buildscript's classpath, which wins over
# AGP's own. Goes with AGP 9 (#361), whose bundled R8 is new enough.
r8 = "9.1.57"
# detekt 1.23 is built against Kotlin 2.0.21 and refuses to run on any other compiler; see the
# resolution pin in the root build script. detekt 2.0 is still alpha.
detekt = "1.23.8"
# detekt parses every source file with this compiler's PSI, not the build's, so while detekt is on
# 1.x no Kotlin language feature newer than 2.0 may be used: 2.0.21 can't read it.
detektKotlin = "2.0.21"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
composeBom = "2025.05.01"
# What the app has shipped since #245, which no BOM names: expo-ui, inside the RN AAR by way of
# expo-router, raised every Compose group to these, and the shell's code came to use them
# (`LocalResources` is ui 1.9+). Routing moving native (#309) took expo-ui out, so they're pinned here
# instead, unchanged. Moving to a stable BOM is a change of its own, since material3's bar and sheet
# move with it.
composeShipped = "1.11.0-beta02"
material3Shipped = "1.5.0-alpha17"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"
coreKtx = "1.17.0"
coreSplashscreen = "1.2.0"
kotlinxCoroutines = "1.10.2"
junit = "6.1.3"
junit4 = "4.13.2"
robolectric = "4.16.1"
snakeyamlEngineKmp = "4.0.1"
# Core library desugaring, for java.time below API 26; see app/build.gradle.kts. Goes with minSdk 26 (#364).
desugarJdkLibs = "2.1.5"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.12.0"
benchmarkMacro = "1.5.0"
uiautomator = "2.4.1"
androidxTestJunit = "1.2.1"
# The Play Billing Library (#189): the version expo-iap ran on, so Play saw no change of library when
# Support moved to native. The plain artifact, not billing-ktx, so its three coroutine wrappers are
# our own (PlayTipBilling). #360 switches to ktx, now that the compiler can read it.
billing = "9.1.0"
# The workout editor's drag-to-reorder (#226, #242).
reorderable = "3.1.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Shipped" }
# One artifact per Compose group, at the version shipped: each group's own constraints align the rest.
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeShipped" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeShipped" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "composeShipped" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeShipped" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Robolectric runs JUnit 4 only, hence a second JUnit beside `:shared`'s Jupiter.
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
snakeyaml-engine-kmp = { module = "it.krzeminski:snakeyaml-engine-kmp", version.ref = "snakeyamlEngineKmp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
