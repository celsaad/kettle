name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup has to run before setup-node: `cache: pnpm` resolves the store path by
      # shelling out to pnpm, so with the order reversed setup-node fails outright. The version
      # comes from the "packageManager" field in package.json, so it is pinned in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      # Unused files, dependencies and exports, plus imports package.json doesn't list — the one
      # class oxlint and tsc both miss, since each looks at a file rather than the project graph.
      - name: Unused code
        run: pnpm run knip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Roughly half this job is babel, not tests. `transformIgnorePatterns` deliberately sends 88
      # node_modules packages through it — react-native, reanimated, worklets, svg, every expo-* —
      # and a cold cache re-transpiles the lot: measured locally at 74s cold against 36s warm, at
      # this same --maxWorkers=2. Only ~26% of the suite's time is test bodies at all; the rest is
      # module graphs being rebuilt, which is exactly what this cache holds (~32MB).
      #
      # Rolling key, same shape as the ccache entry in android.yml and for the same reason: a cache
      # entry is immutable once written, so a fixed key would freeze whatever the first run happened
      # to populate, and every src file touched since would miss forever. Each run restores the
      # newest and writes back a superset. Restoring a stale one is safe — jest keys each cached
      # transform by the file's own content and config hash, so a miss costs a transpile, never a
      # wrong result.
      - name: Restore jest transform cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-${{ github.run_id }}
          restore-keys: |
            jest-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-
            jest-

      # --ci fails rather than writes on a missing snapshot; the worker cap keeps jest from
      # over-subscribing the 2-core runner, where spawning more workers is slower, not faster.
      # TZ is set here as well as in jest.setup.js because that file's process.env assignment is a
      # no-op on Windows; on this Linux runner the env var is what actually makes the DST-crossing
      # streak tests exercise a real transition rather than passing vacuously.
      # pnpm forwards trailing args to the script directly, so this needs no `--` separator.
      - name: Test
        env:
          TZ: America/New_York
        run: pnpm test --ci --maxWorkers=2

  # The native app (docs/native-migration-plan.md), in two jobs, because `:app` hosts the RN app from
  # an AAR (M2) and nothing else does. Both fail on any finding: ktlint, detekt and Android lint hold
  # the same zero-warning rule `pnpm run lint` does. The conformance tests read the repo's own
  # conformance/, so a golden that moves on the TS side fails here too until the Kotlin port agrees.
  #
  # `native` is everything that doesn't need the AAR: `:shared` and its conformance suites, the two
  # generators, and ktlint and detekt across every project. It answers in minutes, whatever state the
  # AAR cache is in. It still installs node_modules, because configuring the build reads `:app`'s
  # versions from there.
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7

      # Same ordering constraint as the jobs above.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Pinned for the same reason as in android.yml: the runner image's default JDK has moved before.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test all but :app
        run: ./gradlew :shared:build :strings:build :theme:build ktlintCheck detekt

      # Which suites ran, which were skipped as unported, and what a failing case got instead.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-reports
          # The root's own reports too: ktlint lints the root build scripts there.
          path: |
            native/android/build/reports/
            native/android/*/build/reports/

  # `native-app` is the shell: the RN AAR in mavenLocal, then `:app:build` (its tests, Android lint,
  # and both variants' resource link against the AAR). Building the AAR is the prebuilt project's whole
  # native build, so it's cached, keyed on what changes native output. JS is deliberately not in the
  # key: the cached release AAR carries a stale bundle, which this job never runs. What reaches users
  # is android.yml's, built fresh.
  native-app:
    runs-on: ubuntu-latest
    # A miss compiles the RN side's C++ on android.yml's ccache (about ten minutes warm); 90 is a
    # hang, as in android.yml.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # 21 as well, for `:app`'s unit tests only (see the toolchain note in app/build.gradle.kts).
      # The last version listed becomes JAVA_HOME, so Gradle itself still runs on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v4

      # Installed here, with retries, rather than left to AGP's on-demand download, which once
      # arrived as a corrupt archive and failed the run in its first minutes. Both builds need it: the
      # AAR to compile, the shell to strip it. The version is React Native's, which the shell reads too.
      - name: Install React Native's NDK
        working-directory: .
        run: |
          ndk=$(sed -nE 's/^ndkVersion = "([^"]+)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            yes | "$sdkmanager" --install "ndk;$ndk" > /dev/null && exit 0
            echo "::warning::NDK $ndk install failed (attempt $attempt)"
            rm -rf "$ANDROID_HOME/ndk/$ndk"
            sleep 10
          done
          exit 1

      # Restore and save are separate steps so the AAR is saved as soon as it's built. A combined
      # actions/cache saves only when the whole job succeeds, so a failure in `:app` threw a ten-minute
      # build away and the next run built it again.
      - name: Restore the RN AAR
        id: aar
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: rn-aar-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'app.json') }}

      # On a miss only. android.yml's ccache, restored rather than rebuilt: master's run of that
      # workflow keeps it warm, and the C++ is most of a cold build.
      - name: Restore ccache
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ hashFiles('pnpm-lock.yaml') }}-
          restore-keys: |
            ccache-android-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-android-

      # arm64 alone: the job compiles and tests the shell, which doesn't care which ABIs the AAR
      # carries, and the Play bundle is android.yml's.
      #
      # The All publication, as in scripts/native-dev.ps1, which says why. ccache's settings are
      # android.yml's, which explains each one.
      - name: Build the RN AAR
        if: steps.aar.outputs.cache-hit != 'true'
        working-directory: .
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --set-config sloppiness=time_macros,include_file_mtime,include_file_ctime,pch_defines,modules
          ccache --set-config hash_dir=false
          ccache --set-config base_dir="$GITHUB_WORKSPACE"
          ccache --set-config compiler_check=content
          pnpm exec expo prebuild --platform android --no-install
          cd android && ./gradlew publishBrownfieldAllPublicationToMavenLocal --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Save the RN AAR
        if: steps.aar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.aar.outputs.cache-primary-key }}

      - name: Build, lint and test :app
        run: ./gradlew :app:build

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-app-reports
          path: native/android/app/build/reports/
