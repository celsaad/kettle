name: Android build

# Builds the Play bundle on the runner: one Gradle build in `native/android`, signed with the upload
# key from the repo's secrets. The artifact comes back attached to the run. See
# docs/building-android.md for the keystore setup.

on:
  # Merging a PR is a push to master, and that build proves the signed release build still works,
  # which ci.yml's `gradlew build` doesn't: it has no upload key. Skipping the prose-only merges keeps
  # it from running for nothing.
  push:
    branches: [master]
    paths-ignore:
      # '**.md', not '**/*.md': GitHub's '**' matches any character including '/', so the latter
      # still requires one and would miss CHANGELOG.md and the other root-level files entirely.
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'store/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'aab for a Play upload, apk to sideload'
        type: choice
        options: [aab, apk]
        default: aab

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A Kotlin and resources build with no native code of its own. 30 minutes is a hang, not a slow
    # build.
    timeout-minutes: 30

    env:
      # `inputs` is empty on the push trigger, so the merge build is an .aab: the same Gradle task the
      # release runs, which is what makes it a meaningful smoke test. An .apk is a universal one: the
      # app carries no native code of its own, so there is nothing to split by ABI.
      VARIANT: ${{ inputs.variant || 'aab' }}
      # The upload certificate every build here must carry: the one the 0.11.0 release bundle, the
      # last one built from the prebuilt app, was signed with, and so the one Play expects. Public,
      # like any certificate — it is the key behind it that's secret. Changing it is changing which key
      # signs the app, which the signing entry in docs/decisions.md says not to do casually; Play would
      # refuse the upload anyway.
      UPLOAD_CERT_SHA256: 48:0A:30:FE:53:E5:84:D0:AF:17:1F:1E:89:39:57:C2:86:12:E5:3E:90:29:44:38:36:5F:6E:E5:AA:0A:AA:54

    steps:
      - uses: actions/checkout@v7

      # Pinned rather than left to the runner image's default, which has changed under us before and
      # would surface as an unrelated-looking Kotlin or AGP error. The build compiles for 17; 21 as
      # well, which it names as its test toolchain (see app/build.gradle.kts). The last version listed
      # becomes JAVA_HOME, so Gradle runs on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Caches ~/.gradle across runs, keyed on the wrapper and the build scripts. It covers the
      # dependency and wrapper downloads and, with --build-cache below, the Kotlin and Java work.
      - uses: gradle/actions/setup-gradle@v4

      # The keystore only exists on disk for the length of the job. It is the *upload* key, not the
      # app signing key — Play holds that one, so a leak here is recoverable by resetting the upload
      # key, and losing this file is not fatal either. Both are still secrets.
      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set. See docs/building-android.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # The shell's release build type signs with these when they're set, and leaves the build unsigned
      # when they aren't (app/build.gradle.kts). The package is Play's, and the versionCode is
      # native/android/gradle.properties', which /bump moves.
      - name: Build the shell
        working-directory: native/android
        env:
          KETTLE_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          KETTLE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KETTLE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KETTLE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = "apk" ]; then
            ./gradlew :app:assembleRelease --build-cache
          else
            ./gradlew :app:bundleRelease --build-cache
          fi

      # Deleted before the artifact upload rather than after, so a failure in between can't sweep the
      # keystore into a partial artifact.
      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # The failure this catches is a build that came out unsigned or signed with some other key: it
      # produces a perfectly valid-looking file that Play rejects on upload, or worse, that a sideload
      # treats as a different app. So the certificate is compared, not just printed. apksigner prints
      # the digest as bare lowercase hex and keytool as colon-separated uppercase, hence the folding.
      - name: Check the signing certificate
        run: |
          outputs=native/android/app/build/outputs
          if [ "$VARIANT" = "apk" ]; then
            certs=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
              "$outputs/apk/release/app-release.apk")
          else
            certs=$(keytool -printcert -jarfile "$outputs/bundle/release/app-release.aab")
          fi
          echo "$certs"
          expected=$(echo "$UPLOAD_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          # An empty pin would match any output at all, which is the check passing vacuously.
          if ! [[ $expected =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::UPLOAD_CERT_SHA256 is not a SHA-256 fingerprint."
            exit 1
          fi
          if ! echo "$certs" | tr -d ':' | tr 'A-F' 'a-f' | grep -q "$expected"; then
            echo "::error::Not signed with the upload certificate ($UPLOAD_CERT_SHA256). See docs/building-android.md."
            exit 1
          fi

      # Named with the run number because most of these share a versionCode: only a release commit
      # bumps it, so a week of merge builds all produce "kettle 0.3.0 (6)" and the filename inside the
      # artifact can't tell them apart.
      - uses: actions/upload-artifact@v4
        with:
          name: kettle-${{ env.VARIANT }}-run${{ github.run_number }}
          path: |
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          # An upload key is not a distribution key, so these are only useful to whoever can already
          # push to Play. Short retention keeps stale builds from being mistaken for the current one.
          retention-days: 14
