  - name: hiit-rounds-past-ceiling
    input: |
      version: 1
      exercises: [{ id: a, name: A, type: hiit, config: { work_sec: 40, rest_sec: 20, rounds: 501 } }]
      workouts: []
      programs: []

  - name: hiit-zero-work
    input: |
