# pnpm-specific settings live here rather than in .npmrc: pnpm 10 began moving them out, and by 11
# an .npmrc entry is read as an npm setting and silently ignored. A misplaced nodeLinker doesn't
# error, it just installs the wrong layout — which is how this file came to exist.

# The flat layout. It was required while the app was React Native, whose bundler and Gradle
# autolinking walked node_modules expecting a flat tree; nothing needs it since M7 (#357), and it's
# kept until the TS project itself goes (#353) rather than churning the lockfile for nothing. Our own
# code imports only what package.json lists (`pnpm knip` fails on anything else).
nodeLinker: hoisted

# Windows caps paths at 260 chars unless LongPathsEnabled is set, and it isn't here (turning it on
# needs admin plus a reboot). pnpm's virtual store encodes the full package name and a hash into one
# directory name; at the default of 120 the longest @babel entries overflow and the install dies
# with ENOENT on mkdir. 60 keeps them under the cap. Still true: jest's TypeScript transform is babel.
virtualStoreDirMaxLength: 60
