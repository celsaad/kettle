config:
  warningsAsErrors: true

# Compose's conventions, which detekt's defaults predate: a composable is named like the UI it emits,
# and a preview is called by Android Studio rather than by any code detekt can see.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
style:
  # Off in detekt's defaults, and nothing else here catches it: ktlint's rule isn't in this ruleset, and
  # the compiler doesn't warn. A refactor's leftovers had piled up to 55 before this was turned on (#274).
  UnusedImports:
    active: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'LocalePreviews']
  # The import rather than the call, because ForbiddenMethodCall needs type resolution and `check` runs
  # without. A wildcard import of `androidx.compose.ui.res` is ktlint's to refuse (no-wildcard-imports).
  ForbiddenImport:
    active: true
    imports:
      - value: 'androidx.compose.ui.res.pluralStringResource'
        reason: 'Use pluralText, which takes the _zero branch Android skips for Portuguese.'
