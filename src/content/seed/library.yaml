# The starter library. Written to exercises.yaml the first time the app launches and finds no library
# file, so the app never opens empty. It is also what a corrupt exercises.yaml is reset to, which is
# why it stays deliberately small. New shipped content goes in a pack (packs/), not here: the seed
# only ever reaches a fresh install.
#
# This is the structural definition, and it is written in English. The names, notes and day labels a
# non-English user sees come from pt.json and ja.json beside this file, applied at seed time, so an
# edit here (a new exercise, a changed week) is a content change every language's table then owes a
# string for. seed-library.test.ts fails the ones that don't.
#
# Curated starter content, not a format demo: two four-week programs a new user can press start on
# without building anything first, plus two standalone workouts so every exercise type has a
# live example. Three authoring constraints it has to respect, none of them local to this file:
#
# - `foundations` must stay first. `activeProgram` (state/selectors/next-up.ts) falls back to
#   `programs[0]` until a session has been run, and there is no starter-program picker, so the
#   no-equipment program is what a fresh install lands on.
# - Weeks run in the order they are written here. Both programs train on days 1, 3 and 5 and rest on
#   the other four, so a reordered block is a reordered week. Every rest day is written out, including
#   the two at the end of each week: the home screen spends one rest entry per calendar day, so a
#   three-session week written as three entries rolls into the next week the day after the last
#   session. Seven entries make the week a week.
# - Every week is enumerated and each override is repeated in every later week it still applies to:
#   weeks resolve sparsely (a gap is skipped, not filled), and overrides don't carry forward.
#
# `notes` describe the progression model and nothing else (no form cues, no injury or diet advice),
# so the app keeps explaining its own data rather than prescribing training. No `target_weight_kg` is
# seeded: loads are the user's to set.
version: 1
exercises:
  - id: rest
    name: Rest
    type: rest
    config:
      duration_sec: 90
  # Foundations: nothing here needs equipment.
  - id: pushups
    name: Push-ups
    type: reps
    config:
      sets: 3
      target_reps_min: 8
      target_reps_max: 15
      rest_sec: 60
    notes: >-
      Stop 2 reps shy of failure. Hit 15 on every set twice before moving to a
      harder variation.
  - id: bodyweight-squats
    name: Bodyweight Squats
    type: reps
    config:
      sets: 3
      target_reps_min: 12
      target_reps_max: 20
      rest_sec: 60
  - id: inverted-rows
    name: Inverted Rows
    type: reps
    config:
      sets: 3
      target_reps_min: 6
      target_reps_max: 12
      rest_sec: 75
    notes: >-
      Under a table or a low bar. Walk your feet further out to make it harder
      once you own the top of the range.
  - id: split-squats
    name: Split Squats
    type: reps
    config:
      sets: 3
      target_reps_min: 8
      target_reps_max: 12
      rest_sec: 60
    notes: >-
      Reps are per leg — log the weaker side, so the number you beat next time
      is the honest one.
  - id: glute-bridge
    name: Glute Bridge
    type: reps
    config:
      sets: 3
      target_reps_min: 12
      target_reps_max: 20
      rest_sec: 45
  - id: plank
    name: Plank
    type: timed_hold
    config:
      sets: 3
      hold_sec_min: 20
      hold_sec_max: 45
      rest_sec: 45
    notes: Raise the whole range by 5s once you hit 45s on every set.
  - id: mountain-climbers
    name: Mountain Climbers
    type: hiit
    config:
      work_sec: 30
      rest_sec: 30
      rounds: 4
  # Dumbbell Strength: one adjustable pair covers all of it.
  - id: db-goblet-squat
    name: Dumbbell Goblet Squat
    type: reps
    config:
      sets: 3
      target_reps_min: 8
      target_reps_max: 12
      rest_sec: 90
    notes: >-
      No weight is seeded — set yours on the first session, then add the
      smallest jump you own once you hit 12 on every set.
  - id: db-floor-press
    name: Dumbbell Floor Press
    type: reps
    config:
      sets: 3
      target_reps_min: 8
      target_reps_max: 12
      rest_sec: 90
    notes: >-
      Pressed off the floor, so it needs no bench. Add weight once you hit 12 on
      every set.
  - id: db-row
    name: Dumbbell Row
    type: reps
    config:
      sets: 3
      target_reps_min: 8
      target_reps_max: 12
      rest_sec: 90
    notes: Reps are per side.
  - id: db-romanian-deadlift
    name: Dumbbell Romanian Deadlift
    type: reps
    config:
      sets: 3
      target_reps_min: 8
      target_reps_max: 12
      rest_sec: 90
  - id: db-overhead-press
    name: Dumbbell Overhead Press
    type: reps
    config:
      sets: 3
      target_reps_min: 6
      target_reps_max: 10
      rest_sec: 90
  - id: farmers-carry
    name: Farmer's Carry
    type: timed_hold
    config:
      sets: 3
      hold_sec_min: 30
      hold_sec_max: 45
      rest_sec: 60
    notes: Add time before adding weight.
  # Standalone conditioning: the types the two programs don't otherwise cover.
  - id: burpees
    name: Burpees
    type: hiit
    config:
      work_sec: 40
      rest_sec: 20
      rounds: 4
  - id: emom-pushups
    name: EMOM Push-ups
    type: emom
    config:
      interval_sec: 60
      total_minutes: 10
      target_reps: 8
    notes: >-
      Every minute on the minute: 8 push-ups, then rest whatever is left of the
      minute. Cut the target once you stop finishing inside it.
  - id: amrap-12-bodyweight
    name: AMRAP 12
    type: amrap
    config:
      time_cap_sec: 720
    notes: >-
      One round is 10 push-ups, 15 bodyweight squats, 10 inverted rows. The app
      times the cap and counts rounds — the movements live here in the notes,
      since an AMRAP has no movement list of its own.
  - id: easy-cardio
    name: Easy Cardio Cooldown
    type: cardio
    config:
      duration_sec: 600
    notes: >-
      Run, bike, row, walk — whatever you have. Add a distance to the config if
      you want that tracked too.
workouts:
  - id: foundations-push
    name: Foundations · Push
    blocks:
      - type: exercise
        exercise: pushups
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: plank
      - type: exercise
        exercise: rest
        config:
          duration_sec: 60
      - type: exercise
        exercise: mountain-climbers
  - id: foundations-legs
    name: Foundations · Legs
    blocks:
      - type: exercise
        exercise: bodyweight-squats
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: split-squats
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: glute-bridge
  - id: foundations-pull
    name: Foundations · Pull
    blocks:
      - type: exercise
        exercise: inverted-rows
      - type: exercise
        exercise: rest
        config:
          duration_sec: 120
      - type: circuit
        id: foundations-finisher
        rounds: 3
        rest_between_exercises_sec: 15
        rest_between_rounds_sec: 60
        # Members are reps/timed_hold on purpose: a circuit repeats a member once per round and
        # ignores its own `sets`, but a hiit/emom/amrap member would run its whole internal
        # timing on every visit (four 30/30 rounds of mountain climbers, three times over).
        exercises:
          - exercise: pushups
          - exercise: bodyweight-squats
          - exercise: plank
  - id: db-full-body-a
    name: Dumbbell Full Body A
    blocks:
      - type: exercise
        exercise: db-goblet-squat
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: db-floor-press
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: db-row
  - id: db-full-body-b
    name: Dumbbell Full Body B
    blocks:
      - type: exercise
        exercise: db-romanian-deadlift
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: db-overhead-press
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: farmers-carry
  - id: mixed-conditioning
    name: Mixed Conditioning
    blocks:
      - type: exercise
        exercise: burpees
      - type: exercise
        exercise: rest
      - type: exercise
        exercise: amrap-12-bodyweight
      - type: exercise
        exercise: rest
        config:
          duration_sec: 120
      - type: exercise
        exercise: easy-cardio
  - id: emom-10
    name: EMOM 10
    blocks:
      - type: exercise
        exercise: emom-pushups
programs:
  - id: foundations
    name: Foundations · 4 Weeks · No Equipment
    weeks:
      - week: 1
        day: Day 1
        workout: foundations-push
        notes: >-
          Baseline week. Log where you actually land in each range — don’t chase
          the top of it yet.
      - week: 1
        day: Day 2
        rest_day: true
        notes: >-
          Rest is where the last session turns into something. Walk if you like;
          nothing heavy.
      - week: 1
        day: Day 3
        workout: foundations-legs
      - week: 1
        day: Day 4
        rest_day: true
      - week: 1
        day: Day 5
        workout: foundations-pull
      - week: 1
        day: Day 6
        rest_day: true
      - week: 1
        day: Day 7
        rest_day: true
      - week: 2
        day: Day 1
        workout: foundations-push
        notes: >-
          Same three sessions. Aim for one more rep than you logged in week 1,
          on every set.
      - week: 2
        day: Day 2
        rest_day: true
      - week: 2
        day: Day 3
        workout: foundations-legs
      - week: 2
        day: Day 4
        rest_day: true
      - week: 2
        day: Day 5
        workout: foundations-pull
      - week: 2
        day: Day 6
        rest_day: true
      - week: 2
        day: Day 7
        rest_day: true
      - week: 3
        day: Day 1
        workout: foundations-push
        notes: >-
          A fourth set everywhere. Keep the reps where they were rather than
          pushing both at once.
        overrides:
          - exercise: pushups
            config:
              sets: 4
          - exercise: plank
            config:
              sets: 4
      - week: 3
        day: Day 2
        rest_day: true
      - week: 3
        day: Day 3
        workout: foundations-legs
        overrides:
          - exercise: bodyweight-squats
            config:
              sets: 4
          - exercise: split-squats
            config:
              sets: 4
      - week: 3
        day: Day 4
        rest_day: true
      - week: 3
        day: Day 5
        workout: foundations-pull
        overrides:
          - exercise: inverted-rows
            config:
              sets: 4
      - week: 3
        day: Day 6
        rest_day: true
      - week: 3
        day: Day 7
        rest_day: true
      # Week 4 repeats week 3's overrides verbatim: an override applies to its own week only.
      - week: 4
        day: Day 1
        workout: foundations-push
        notes: >-
          Heaviest week of the block. Now push the reps toward the top of each
          range.
        overrides:
          - exercise: pushups
            config:
              sets: 4
          - exercise: plank
            config:
              sets: 4
      - week: 4
        day: Day 2
        rest_day: true
      - week: 4
        day: Day 3
        workout: foundations-legs
        overrides:
          - exercise: bodyweight-squats
            config:
              sets: 4
          - exercise: split-squats
            config:
              sets: 4
      - week: 4
        day: Day 4
        rest_day: true
      - week: 4
        day: Day 5
        workout: foundations-pull
        notes: >-
          Last session of the block, and a fourth finisher round. Completing it
          loops back to week 1 — run it again with the top of each range as your
          new floor.
        overrides:
          - exercise: inverted-rows
            config:
              sets: 4
          - block: foundations-finisher
            config:
              rounds: 4
      - week: 4
        day: Day 6
        rest_day: true
      - week: 4
        day: Day 7
        rest_day: true
  - id: dumbbell-strength
    name: Dumbbell Strength · 4 Weeks
    # Three sessions a week alternating two full-body workouts, so each lands twice a fortnight.
    weeks:
      - week: 1
        day: Day 1
        workout: db-full-body-a
        notes: >-
          Baseline week. Pick weights you could stop 2 reps shy of failure with,
          and write them into each exercise.
      - week: 1
        day: Day 2
        rest_day: true
        notes: A day between sessions is part of the plan, not a gap in it.
      - week: 1
        day: Day 3
        workout: db-full-body-b
      - week: 1
        day: Day 4
        rest_day: true
      - week: 1
        day: Day 5
        workout: db-full-body-a
      - week: 1
        day: Day 6
        rest_day: true
      - week: 1
        day: Day 7
        rest_day: true
      - week: 2
        day: Day 1
        workout: db-full-body-b
        notes: >-
          The A/B order flips this week. Add the smallest jump you own to
          anything you hit the top of the range on.
      - week: 2
        day: Day 2
        rest_day: true
      - week: 2
        day: Day 3
        workout: db-full-body-a
      - week: 2
        day: Day 4
        rest_day: true
      - week: 2
        day: Day 5
        workout: db-full-body-b
      - week: 2
        day: Day 6
        rest_day: true
      - week: 2
        day: Day 7
        rest_day: true
      - week: 3
        day: Day 1
        workout: db-full-body-a
        notes: A fourth set everywhere. Hold the weights where they are this week.
        overrides:
          - exercise: db-goblet-squat
            config:
              sets: 4
          - exercise: db-floor-press
            config:
              sets: 4
          - exercise: db-row
            config:
              sets: 4
      - week: 3
        day: Day 2
        rest_day: true
      - week: 3
        day: Day 3
        workout: db-full-body-b
        overrides:
          - exercise: db-romanian-deadlift
            config:
              sets: 4
          - exercise: db-overhead-press
            config:
              sets: 4
          - exercise: farmers-carry
            config:
              sets: 4
      - week: 3
        day: Day 4
        rest_day: true
      - week: 3
        day: Day 5
        workout: db-full-body-a
        overrides:
          - exercise: db-goblet-squat
            config:
              sets: 4
          - exercise: db-floor-press
            config:
              sets: 4
          - exercise: db-row
            config:
              sets: 4
      - week: 3
        day: Day 6
        rest_day: true
      - week: 3
        day: Day 7
        rest_day: true
      - week: 4
        day: Day 1
        workout: db-full-body-b
        notes: >-
          Heaviest week of the block: four sets, and add weight wherever week 3
          felt easy.
        overrides:
          - exercise: db-romanian-deadlift
            config:
              sets: 4
          - exercise: db-overhead-press
            config:
              sets: 4
          - exercise: farmers-carry
            config:
              sets: 4
      - week: 4
        day: Day 2
        rest_day: true
      - week: 4
        day: Day 3
        workout: db-full-body-a
        overrides:
          - exercise: db-goblet-squat
            config:
              sets: 4
          - exercise: db-floor-press
            config:
              sets: 4
          - exercise: db-row
            config:
              sets: 4
      - week: 4
        day: Day 4
        rest_day: true
      - week: 4
        day: Day 5
        workout: db-full-body-b
        notes: >-
          Last session of the block. Completing it loops back to week 1 — run it
          again from the weights you finished on.
        overrides:
          - exercise: db-romanian-deadlift
            config:
              sets: 4
          - exercise: db-overhead-press
            config:
              sets: 4
          - exercise: farmers-carry
            config:
              sets: 4
      - week: 4
        day: Day 6
        rest_day: true
      - week: 4
        day: Day 7
        rest_day: true
