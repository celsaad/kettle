[versions]
# AGP and Kotlin are the M0 spike's, which were React Native's own (react-native/gradle/
# libs.versions.toml), so the shell and the RN AAR it hosts in M2 share one toolchain.
agp = "8.12.0"
kotlin = "2.1.20"
# detekt 1.23 is built against Kotlin 2.0.21 and refuses to run on any other compiler; see the
# resolution pin in the root build script.
detekt = "1.23.8"
detektKotlin = "2.0.21"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
composeBom = "2025.05.01"
activityCompose = "1.10.1"
junit = "6.1.3"
snakeyamlEngineKmp = "4.0.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
snakeyaml-engine-kmp = { module = "it.krzeminski:snakeyaml-engine-kmp", version.ref = "snakeyamlEngineKmp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
