      workouts: []
      programs: []

  - name: sets-at-ceiling
    input: |
      version: 1
      exercises:
        - { id: a, name: A, type: reps, config: { sets: 500, target_reps_min: 5, rest_sec: 60 } }
        - { id: b, name: B, type: timed_hold, config: { sets: 500, hold_sec_min: 30, rest_sec: 60 } }
        - { id: c, name: C, type: hiit, config: { work_sec: 40, rest_sec: 20, rounds: 500 } }
      workouts: []
      programs: []

  - name: reps-sets-past-ceiling
    input: |
      version: 1
      exercises: [{ id: a, name: A, type: reps, config: { sets: 501, target_reps_min: 5, rest_sec: 60 } }]
