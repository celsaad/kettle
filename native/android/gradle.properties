org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Tasks run in parallel, within a project as well as across them, and a build whose scripts and
# inputs haven't changed skips configuration. Every gradlew command the scripts and docs name was run
# with it on before it was turned on; a task that breaks it fails loudly, naming the problem.
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Where `:app`'s test toolchain finds its JDK 21 on CI: setup-java exports JAVA_HOME_21_X64, and Gradle
# reads only the variables named here. Locally the JDK running Gradle (Android Studio's 21) is found anyway.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
# The app's version, which /bump moves and app/build.gradle.kts reads. versionCode is Android's own
# build number, raised only when Android ships; versionName is shared with every platform, taken from
# CHANGELOG.md's heading. The line continues the Play app's: the shell replaced it in place.
kettle.versionCode=21
kettle.versionName=0.15.0
