name: CI

# Push only for master: a PR branch is covered by pull_request, and running both put two identical
# runs of every job on each push to an open PR.
on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same PR supersedes the run still going. master's group is its commit, so every
# merge gets a run of its own, side by side with the last: grouped by ref instead, a burst of merges
# would queue, and GitHub drops all but the newest waiting run in a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup has to run before setup-node: `cache: pnpm` resolves the store path by
      # shelling out to pnpm, so with the order reversed setup-node fails outright. The version
      # comes from the "packageManager" field in package.json, so it is pinned in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Node is here for oxfmt alone since the TS domain went (#353): it formats site/, the shipped
      # JSON and the conformance corpus, which no Gradle task owns.
      - name: Format
        run: pnpm run format:check

  # The native app (docs/native-migration-plan.md): `./gradlew build` over every project, which is
  # each one's tests, ktlint, detekt, Android lint and compiler warnings, all failing on any finding,
  # the zero-warning rule AGENTS.md sets. No Node: the build reads the repo's plain files
  # (the locale bundles, theme.json, content, the sounds) and nothing a JS install provides, so
  # this job is the fresh-clone check that it stays that way. The conformance tests read the repo's own
  # conformance/, whose goldens :shared writes, so a behaviour change without its golden fails here.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7

      # 21 for `:app`'s unit tests only (see the toolchain note in app/build.gradle.kts). The last
      # version listed becomes JAVA_HOME, so Gradle itself runs on 17. Pinned because the runner
      # image's default JDK has moved before.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      # The key lets setup-gradle save the configuration cache between runs, which it holds encrypted
      # because a configuration can capture secrets. Without the secret it skips only that part, and
      # the build still configures from scratch and runs its tasks in parallel. The secret is a random
      # AES key, made with `openssl rand -base64 16 | gh secret set GRADLE_ENCRYPTION_KEY`; replacing
      # it costs one run's configuration, nothing more.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Robolectric fetches its android-all jars, one per SDK the tests run at, into ~/.m2 at test
      # time, outside Gradle's caches, so setup-gradle never saved them and every run downloaded them
      # again. The key is exactly what picks the jars: Robolectric's version, targetSdk (the default
      # SDK) and every `@Config(sdk = ...)` in the tests, so no other edit writes a new entry, and one
      # that adds an SDK does. The prefix restore keeps the jars it didn't change.
      - name: Name Robolectric's SDK set
        id: robolectric
        run: |
          set=$(
            grep -h '^robolectric = "' gradle/libs.versions.toml
            grep -ho 'targetSdk = [0-9]*' app/build.gradle.kts
            grep -rho '@Config(sdk = [^)]*' app/src/test | sort -u
          )
          echo "key=$(printf '%s' "$set" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Robolectric's SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.key }}
          restore-keys: robolectric-

      - name: Build, lint and test
        run: ./gradlew build

      # Which suites ran, which were skipped as unported, and what a failing case got instead.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-reports
          # The root's own reports too: ktlint lints the root build scripts there.
          path: |
            native/android/build/reports/
            native/android/*/build/reports/
