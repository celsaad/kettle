  # --- EMOM's derived interval count ---

  - name: emom-derived-count-past-ceiling
    why: 60 minutes of 1-second intervals is 3600 intervals from two fields that are each in range
    input: |
      version: 1
      exercises: [{ id: e, name: E, type: emom, config: { interval_sec: 1, total_minutes: 60 } }]
      workouts: []
      programs: []

  - name: emom-tiny-interval
    input: |
      version: 1
      exercises: [{ id: e, name: E, type: emom, config: { interval_sec: 0.001, total_minutes: 1 } }]
      workouts: []
      programs: []

  - name: emom-total-minutes-past-ceiling
    input: |
      version: 1
      exercises: [{ id: e, name: E, type: emom, config: { interval_sec: 300, total_minutes: 1441 } }]
      workouts: []
      programs: []

  - name: emom-exactly-500-intervals-float
    why: 500 one-second intervals is 8.333333333333334 minutes, whose raw quotient is 500.00000000000006
    input: |
      version: 1
      exercises: [{ id: e, name: E, type: emom, config: { interval_sec: 1, total_minutes: 8.333333333333334 } }]
      workouts: []
      programs: []

  - name: emom-partial-trailing-interval
    input: |
      version: 1
      exercises: [{ id: e, name: E, type: emom, config: { interval_sec: 45, total_minutes: 10 } }]
      workouts: []
      programs: []

  # --- Workouts ---

  - name: circuit-rounds-past-ceiling
    input: |
      version: 1
      exercises:
        - { id: a, name: A, type: rest, config: { duration_sec: 1 } }
        - { id: b, name: B, type: rest, config: { duration_sec: 1 } }
      workouts:
        - { id: w, name: W, blocks: [{ type: circuit, rounds: 501, exercises: [{ exercise: a }, { exercise: b }] }] }
      programs: []

  - name: circuit-single-member
    input: |
      version: 1
      exercises: [{ id: a, name: A, type: rest, config: { duration_sec: 1 } }]
      workouts:
        - { id: w, name: W, blocks: [{ type: circuit, rounds: 2, exercises: [{ exercise: a }] }] }
      programs: []

  - name: unknown-block-type
    input: |
      version: 1
      exercises: [{ id: a, name: A, type: rest, config: { duration_sec: 1 } }]
      workouts: [{ id: w, name: W, blocks: [{ type: superset, exercise: a }] }]
      programs: []

  - name: dangling-exercise-reference-parses
    why: references are checked by merge, not by the parser
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [{ type: exercise, exercise: nowhere }] }]
      programs: []

  # --- Programs ---

  - name: week-without-workout
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [] }]
      programs: [{ id: p, name: P, weeks: [{ week: 1, workout: w }, { week: 2 }] }]

