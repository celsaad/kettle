org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Where `:app`'s test toolchain finds its JDK 21 on CI: setup-java exports JAVA_HOME_21_X64, and Gradle
# reads only the variables named here. Locally the JDK running Gradle (Android Studio's 21) is found anyway.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
