  - name: program-without-weeks
    input: |
      version: 1
      exercises: []
      workouts: []
      programs: [{ id: p, name: P, weeks: [] }]

  - name: repeated-week-and-day
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [] }]
      programs: [{ id: p, name: P, weeks: [{ week: 1, day: Mon, workout: w }, { week: 1, day: Mon, workout: w }] }]

  - name: repeated-week-different-days
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [] }]
      programs: [{ id: p, name: P, weeks: [{ week: 1, day: Mon, workout: w }, { week: 1, day: Thu, workout: w }] }]

  - name: override-naming-both-targets
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [] }]
      programs:
        - id: p
          name: P
          weeks: [{ week: 1, workout: w, overrides: [{ exercise: a, block: b, config: { sets: 2 } }] }]

  - name: override-naming-no-target
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [] }]
      programs: [{ id: p, name: P, weeks: [{ week: 1, workout: w, overrides: [{ config: { sets: 2 } }] }] }]

  - name: override-config-is-free-form
    why: an override's config is any record of numbers and strings; it is checked when applied, not here
    input: |
      version: 1
      exercises: []
      workouts: [{ id: w, name: W, blocks: [] }]
      programs:
        - id: p
          name: P
          weeks: [{ week: 1, workout: w, overrides: [{ exercise: a, config: { sets: 200000, anything: text } }] }]

