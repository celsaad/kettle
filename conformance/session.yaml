# parseSessionYaml. Same shape as library.yaml: inline `input`, one defect per refusal.
cases:
  - name: every-entry-type
    input: |
      version: 1
      id: 2024-05-01T10-00-00-abc
      workout: full
      program: block
      program_week: 2
      program_day: Monday
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: "2024-05-01T10:45:00.000Z"
      entries:
        - exercise: hold
          type: timed_hold
          sets: [{ hold_sec: 20, rest_taken_sec: 60 }, { hold_sec: 18.5, rest_taken_sec: 0 }]
        - exercise: bench
          type: reps
          sets:
            - { reps: 5, weight: 80, rpe: 8, rest_taken_sec: 180 }
            - { reps: 0, rest_taken_sec: 0 }
        - { exercise: rest, type: rest, rest_taken_sec: 90 }
        - { exercise: burpees, type: hiit, rounds_completed: 4 }
        - exercise: clean
          type: emom
          minutes: [{ reps: 3 }, {}, { reps: 0 }]
        - { exercise: grinder, type: amrap, rounds_completed: 7, extra_reps: 3 }
        - { exercise: grinder, type: amrap, rounds_completed: 0 }
        - { exercise: row, type: cardio, duration_sec: 480, distance_meters: 2000 }
        - { exercise: walk, type: cardio }

  - name: in-progress
    why: no end time yet, and a free session with no workout
    input: |
      version: 1
      id: s
      workout: null
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []

  - name: written-before-program-tracking
    why: the three program fields default to null when absent
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: "2024-05-01T10:30:00.000Z"
      entries: []

  - name: unquoted-timestamp-stays-a-string
    why: no timestamp type in the core schema, so a hand-edited unquoted time still reads as text
    input: |
      version: 1
      id: s
      workout: w
      started_at: 2024-05-01T10:00:00Z
      ended_at: null
      entries: []

  - name: missing-ended-at
    why: ended_at is nullable but not optional
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      entries: []

  - name: rpe-past-ten
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: reps, sets: [{ reps: 5, rpe: 11, rest_taken_sec: 0 }] }]

  - name: rpe-zero
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: reps, sets: [{ reps: 5, rpe: 0, rest_taken_sec: 0 }] }]

  - name: fractional-reps
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: reps, sets: [{ reps: 2.5, rest_taken_sec: 0 }] }]

  - name: program-week-zero
    input: |
      version: 1
      id: s
      workout: w
      program: p
      program_week: 0
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []

  - name: unknown-entry-type
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: yoga }]

  - name: not-yaml
    input: 'entries: {'

  - name: dollar-brace-stays-a-string
    why: some YAML 1.2 loaders resolve a plain `${NAME}` from the environment; js-yaml reads it as text
    input: |
      version: 1
      id: s
      workout: w
      program_day: ${HOME}
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []

  - name: merge-key-is-not-merged
    why: '`<<` is a YAML 1.1 merge key, not part of 1.2, so it is an unknown key and dropped, leaving the entry without its type'
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries:
        - &rest { exercise: a, type: rest, rest_taken_sec: 90 }
        - { <<: *rest, exercise: b }

  - name: largest-safe-integer
    why: a schema integer is JavaScript's safe-integer range, wider than a 32-bit int
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: hiit, rounds_completed: 9007199254740991 }]

  - name: integer-past-safe-range
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: hiit, rounds_completed: 9007199254740992 }]

  - name: entry-not-a-mapping
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [3]

  - name: overflowing-float-stays-a-string
    why: a float literal too big for a double isn't a float in js-yaml's core schema, so it stays text; only .inf spells infinity
    input: |
      version: 1
      id: s
      workout: w
      program_day: 1e400
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []

  - name: signed-infinity-is-a-number-and-refused
    why: '`+.inf` is infinity, a number, so it reaches the schema, which refuses a non-finite one'
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: [{ exercise: a, type: rest, rest_taken_sec: +.inf }]

  - name: set-tag-is-a-yaml-error
    why: '`!!set` is a YAML 1.1 type; js-yaml refuses it as an unknown tag even under a key the schema drops'
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: !!set { a }

  - name: key-duplicated-once-stringified
    why: js-yaml makes every key a string before it checks for duplicates, so `1` and `"1"` are one key
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      1: a
      "1": b

  - name: boolean-key-duplicated-once-stringified
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { True: a, "true": b }

  - name: float-key-duplicated-once-stringified
    why: '`1.0` is the number 1, which JS spells `1`'
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 1.0: a, 1: b }

  - name: small-float-key-duplicated-once-stringified
    why: JS writes a number in exponent form only below 1e-6, so `0.0001` is spelled as written
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 0.0001: a, "0.0001": b }

  - name: large-float-key-duplicated-once-stringified
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 12345678.9: a, "12345678.9": b }

  - name: exponent-key-duplicated-once-stringified
    why: from 1e21 up JS writes the exponent form, with an explicit `+`
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 1e21: a, "1e+21": b }

  - name: shortest-digits-key-duplicated-once-stringified
    why: JS spells a number in the fewest digits that read back, which some platforms' own printing doesn't
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 1.2345e21: a, "1.2345e+21": b }

  - name: halfway-key-duplicated-once-stringified
    why: this double is exactly …489.25, so two shortest spellings are equally near, and JS takes the even one
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 1490789822986489.25: a, "1490789822986489.2": b }

  - name: power-of-two-key-duplicated-once-stringified
    why: 2^-1017 has a closer double above than below, so its shortest spelling isn't the nearest one of that length
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 7.120236347223045e-307: a, "7.120236347223045e-307": b }

  - name: unsafe-integer-key-duplicated-once-stringified
    why: an integer past 2^53 is a JS number first, so it rounds to the nearest double before it is spelled
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 9007199254740993: a, "9007199254740992": b }

  - name: hex-key-duplicated-once-stringified
    why: a hex integer is the number it spells, written in decimal
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { 0x10: a, "16": b }

  - name: tagged-key-duplicated-once-stringified
    why: an explicit `!!str` makes the string `1`, the same key as the number once stringified
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { !!str 1: a, 1: b }

  - name: alias-key-duplicated-once-stringified
    why: an alias as a key stands for its scalar's value
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      anchor: &k 1
      unused: { *k : a, "1": b }

  - name: keys-distinct-once-stringified-load
    why: '`01` stays a string and a literal block keeps its newline, so neither is the key `1`'
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused:
        1: a
        "01": b
        ? |
          1
        : c

  - name: collection-key-is-a-yaml-error
    why: js-yaml refuses a sequence or mapping as a key outright
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      unused: { [1]: a }

  - name: alias-to-collection-key-is-a-yaml-error
    input: |
      version: 1
      id: s
      workout: w
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
      anchor: &m { a: 1 }
      unused: { *m : a }

  - name: yes-no-on-off-stay-strings
    why: YAML 1.2 core schema — yes/no/on/off are not booleans, so each fills a string field
    input: |
      version: 1
      id: off
      workout: no
      program: on
      program_day: yes
      started_at: "2024-05-01T10:00:00.000Z"
      ended_at: null
      entries: []
