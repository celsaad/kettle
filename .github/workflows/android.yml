name: Android build

# Builds the Play bundle on the runner, in two Gradle builds: `expo prebuild` regenerates the
# gitignored `android/` tree, which publishes the RN app as an AAR into mavenLocal; then the native
# shell in `native/android` builds the `.aab` around it (docs/native-migration-plan.md, M2). The
# artifact comes back attached to the run. Nothing here talks to EAS — see docs/building-android.md
# for the one-time keystore setup and for what to do when a build gets slow.

on:
  # Merging a PR is a push to master, and that build is doing two jobs: it proves the release build
  # still works (ci.yml's native-app job builds the shell, but against a cached arm64 AAR), and it
  # leaves a warm ccache behind. Actions caches don't flow from a branch to master, only the other
  # way, so master's cache can only be warmed by a run *on master* — which is the whole reason this is
  # a merge trigger and not a PR one. Skipping the prose-only merges keeps that from costing half an
  # hour for nothing.
  push:
    branches: [master]
    paths-ignore:
      # '**.md', not '**/*.md': GitHub's '**' matches any character including '/', so the latter
      # still requires one and would miss CHANGELOG.md and the other root-level files entirely.
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'store/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'aab for a Play upload, apk to sideload'
        type: choice
        options: [aab, apk]
        default: aab

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold cache spends most of its time compiling C++ (reanimated, worklets and expo-modules-core
    # all ship sources, not prebuilt .so files). 90 minutes is a hang, not a slow build.
    timeout-minutes: 90

    env:
      # `inputs` is empty on the push trigger, so the merge build is an .aab: the same Gradle task the
      # release runs, over the same four ABIs, which is what makes it a meaningful smoke test and a
      # useful cache warmer. An .apk build would only warm a quarter of it.
      VARIANT: ${{ inputs.variant || 'aab' }}
      # An .aab has to carry every ABI, since Play splits it per device. An .apk here is for
      # sideloading onto a real phone, so it's built arm64-only — that is three quarters less C++ to
      # compile, and no phone shipped in the last several years wants the other three. One flag for
      # both builds: the shell filters its ABIs by it, and has to agree with what the AAR carries.
      ABI_FLAG: ${{ inputs.variant == 'apk' && '-PreactNativeArchitectures=arm64-v8a' || '' }}
      # The upload certificate every build here must carry: the one the 0.11.0 release bundle, the
      # last one built from the prebuilt app, was signed with, and so the one Play expects. Public,
      # like any certificate — it is the key behind it that's secret. Changing it is changing which key
      # signs the app, which the signing entry in docs/decisions.md says not to do casually; Play would
      # refuse the upload anyway.
      UPLOAD_CERT_SHA256: 48:0A:30:FE:53:E5:84:D0:AF:17:1F:1E:89:39:57:C2:86:12:E5:3E:90:29:44:38:36:5F:6E:E5:AA:0A:AA:54

    steps:
      - uses: actions/checkout@v7

      # Same ordering constraint as ci.yml: `cache: pnpm` shells out to pnpm to find the store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Pinned rather than left to the runner image's default, which has changed under us before and
      # would surface as an unrelated-looking Kotlin or AGP error. Expo SDK 57 is a JDK 17 toolchain.
      # 21 as well, which the shell's build names as its test toolchain (see app/build.gradle.kts);
      # the last version listed becomes JAVA_HOME, so both builds still run on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Caches ~/.gradle across runs, keyed on the wrapper and the build scripts of both builds. It
      # covers the dependency and wrapper downloads and, with --build-cache below, the Kotlin and Java
      # work.
      - uses: gradle/actions/setup-gradle@v4

      # The NDK output can't ride in the Gradle cache: it lands in android/.cxx, which prebuild
      # regenerates every run, and externalNativeBuild tasks aren't cacheable anyway. ccache works at
      # the compiler instead, so it survives that. Rolling key — each run restores the newest cache
      # and writes back a superset, since a cache entry is immutable once written.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-android-

      # ccache is not on the ubuntu-24.04 image, so it's installed rather than just configured. The
      # sloppiness settings are what make it hit at all across runs: the NDK's __DATE__/__TIME__
      # macros and reanimated's generated stub PCH would otherwise miss every time. base_dir +
      # hash_dir=false stop the absolute build path (which android/ regenerates) from being part of
      # the hash.
      - name: Install and configure ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache --set-config max_size=2G
          ccache --set-config sloppiness=time_macros,include_file_mtime,include_file_ctime,pch_defines,modules
          ccache --set-config hash_dir=false
          ccache --set-config base_dir="$GITHUB_WORKSPACE"
          ccache --set-config compiler_check=content
          ccache --zero-stats

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-ndk

      # --no-install because `pnpm install` above already installed, and prebuild would otherwise run the
      # package manager a second time.
      - name: Prebuild android/
        run: pnpm exec expo prebuild --platform android --no-install

      # The release publication alone, where scripts/native-dev.ps1 publishes All: that script's warning
      # is about a mavenLocal that already holds the other variant, and this runner's starts empty. The
      # shell builds release only, so the debug half would be a second full C++ build for nothing. The
      # AAR carries the JS bundle, built here from this commit.
      - name: Build the RN AAR
        working-directory: android
        env:
          # CMake reads these as the default for CMAKE_<LANG>_COMPILER_LAUNCHER, which is the only
          # way in without editing every module's externalNativeBuild block. If the stats step below
          # reports zero hits on a warm run, this is what didn't take.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # No --no-daemon: gradle/actions manages the daemon's lifecycle itself, and killing it early
        # costs the caching it sets up.
        # $ABI_FLAG unquoted, so the .aab's empty one passes no argument at all.
        run: ./gradlew publishBrownfieldReleasePublicationToMavenLocal --build-cache $ABI_FLAG

      # The keystore only exists on disk for the length of the job. It is the *upload* key, not the
      # app signing key — Play holds that one, so a leak here is recoverable by resetting the upload
      # key, and losing this file is not fatal either. Both are still secrets.
      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set. See docs/building-android.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # The shell's release build type signs with these when they're set, and leaves the build unsigned
      # when they aren't (app/build.gradle.kts). Same package and versionCode as the prebuilt app,
      # both read from app.json, so this replaces the Play install in place.
      - name: Build the shell
        working-directory: native/android
        env:
          KETTLE_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          KETTLE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KETTLE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KETTLE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = "apk" ]; then
            ./gradlew :app:assembleRelease --build-cache $ABI_FLAG
          else
            ./gradlew :app:bundleRelease --build-cache
          fi

      # Read this on a warm run before believing any of the above. A hit rate near zero means the
      # compiler launcher never reached the CMake invocations and the cache is dead weight.
      #
      # Guarded on ccache existing: this runs even when an earlier step failed, and reporting on a
      # cache that was never installed buries the real error under a second, louder one.
      - name: ccache stats
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats --verbose || echo 'ccache not installed'

      # Deleted before the artifact upload rather than after, so a failure in between can't sweep the
      # keystore into a partial artifact.
      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # The failure this catches is a build that came out unsigned or signed with some other key: it
      # produces a perfectly valid-looking file that Play rejects on upload, or worse, that a sideload
      # treats as a different app. So the certificate is compared, not just printed. apksigner prints
      # the digest as bare lowercase hex and keytool as colon-separated uppercase, hence the folding.
      - name: Check the signing certificate
        run: |
          outputs=native/android/app/build/outputs
          if [ "$VARIANT" = "apk" ]; then
            certs=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
              "$outputs/apk/release/app-release.apk")
          else
            certs=$(keytool -printcert -jarfile "$outputs/bundle/release/app-release.aab")
          fi
          echo "$certs"
          expected=$(echo "$UPLOAD_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          # An empty pin would match any output at all, which is the check passing vacuously.
          if ! [[ $expected =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::UPLOAD_CERT_SHA256 is not a SHA-256 fingerprint."
            exit 1
          fi
          if ! echo "$certs" | tr -d ':' | tr 'A-F' 'a-f' | grep -q "$expected"; then
            echo "::error::Not signed with the upload certificate ($UPLOAD_CERT_SHA256). See docs/building-android.md."
            exit 1
          fi

      # Named with the run number because most of these share a versionCode: only a release commit
      # bumps it, so a week of merge builds all produce "kettle 0.3.0 (6)" and the filename inside the
      # artifact can't tell them apart.
      - uses: actions/upload-artifact@v4
        with:
          name: kettle-${{ env.VARIANT }}-run${{ github.run_number }}
          path: |
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          # An upload key is not a distribution key, so these are only useful to whoever can already
          # push to Play. Short retention keeps stale builds from being mistaken for the current one.
          retention-days: 14
