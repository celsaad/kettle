<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Only the two weights this page actually sets. A declared-but-unused @font-face never loads —
         browsers fetch lazily — and would fail the build script's "every brand font loaded"
         assertion for no reason. Add a face here only alongside the rule that uses it. */
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 700;
        src: url('../site/fonts/space-grotesk-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        font-weight: 500;
        src: url('../site/fonts/hanken-grotesk-500.woff2') format('woff2');
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      /* The icon's own terracotta gradient, so the feature graphic and the icon read as one asset.
     Play advises vibrant colour and warns against dark grey, which rules out the app's ink band. */
      .card {
        width: 1024px;
        height: 500px;
        background: linear-gradient(145deg, #d9764080 0%, #c05c2b 55%, #a94e22 100%), #c05c2b;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 52px;
        padding: 0 96px;
        position: relative;
      }
      /* Play crops the edges on some surfaces and centres the focal point, so the lock-up is centred
     rather than ranged left, and nothing meaningful sits within ~96px of a side. */
      .mark {
        width: 196px;
        height: 196px;
        flex: none;
        color: #f6f0e6;
      }
      .mark svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .word {
        font-family: 'Space Grotesk';
        font-weight: 700;
        font-size: 92px;
        line-height: 1;
        color: #f9f4ec;
        letter-spacing: -0.02em;
      }
      .tag {
        font-family: 'Hanken Grotesk';
        font-weight: 500;
        font-size: 30px;
        line-height: 1.32;
        color: #fbf1e4;
        margin-top: 14px;
        max-width: 17ch;
      }
      .rule {
        width: 74px;
        height: 5px;
        border-radius: 3px;
        background: #f6e0cc;
        margin-top: 22px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M13,32 C8,26 14,21 11,15"
            stroke="currentColor"
            stroke-width="3.2"
            stroke-linecap="round"
            opacity="0.75" />
          <path
            d="M22,30 C17,24 23,19 20,13"
            stroke="currentColor"
            stroke-width="3.2"
            stroke-linecap="round"
            opacity="0.5" />
          <path d="M40,42 C42,23 82,23 84,42" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" />
          <ellipse cx="62" cy="43" rx="24" ry="6.5" fill="currentColor" />
          <circle cx="62" cy="33" r="5.5" fill="currentColor" />
          <path
            d="M30,71 C30,53 44,45 62,45 C80,45 96,53 96,71 C96,88 80,95 62,95 C44,95 30,88 30,71 Z"
            fill="currentColor" />
          <path d="M33,60 L15,45 L21,39 L39,52 Z" fill="currentColor" />
          <rect x="47" y="93" width="30" height="7" rx="3.5" fill="currentColor" />
        </svg>
      </div>
      <div>
        <div class="word">Kettle</div>
        <div class="tag">Your training, in a file you own.</div>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
